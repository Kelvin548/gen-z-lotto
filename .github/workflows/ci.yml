name: Gen-Z Lotto CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      NODE_ENV: test
      DATABASE_URL: "mysql://root:rootpassword@localhost:3306/test_db"
      JWT_SECRET: "ci-secret-key-32-characters-minimum!"
      DEMO_DEPOSIT_ENABLED: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Push Prisma Schema to Test DB
        run: npx prisma db push --skip-generate

      - name: Run ESLint
        run: npm run lint --dir .

      - name: Type Check TypeScript
        run: npx tsc --noEmit

      - name: Run Unit & E2E Test Suite
        run: npm test

      - name: Build Next.js Application
        run: npm run build